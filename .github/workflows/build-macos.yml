name: Build Installers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Installers to build
        type: choice
        default: All
        options:
          - All
          - Intel
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows portable package
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'Intel'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build clean public package
        shell: pwsh
        run: .\build_portable_package.ps1 -Clean -PublicRelease

      - name: Verify clean database and packaged server
        shell: pwsh
        run: |
          $package = Join-Path $PWD "portable\Field Trial Secretary"
          $database = Join-Path $package "data\field_trial_secretary.sqlite"
          $executable = Join-Path $package "FieldTrialSecretary.exe"
          $process = Start-Process -FilePath $executable -ArgumentList @('--host','127.0.0.1','--port','8878') -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:8878/api/status'
                if ($status.ok) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Packaged Windows application did not start." }
            $stateCount = python -c "import sqlite3; c=sqlite3.connect(r'$database'); print(c.execute('select count(*) from app_state').fetchone()[0]); c.close()"
            if ([int]$stateCount -ne 0) { throw "Public package contains application state." }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Field-Trial-Secretary-Windows
          path: portable/Field-Trial-Secretary-*-portable-*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build macOS ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'Intel' && '[{"architecture":"Intel","runner":"macos-15-intel"}]' || '[{"architecture":"Apple-Silicon","runner":"macos-latest"},{"architecture":"Intel","runner":"macos-15-intel"}]') }}

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos-build.txt

      - name: Configure Developer ID signing
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          REQUIRE_NOTARIZATION: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERTIFICATE:-}" || -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]]; then
            if [[ "$REQUIRE_NOTARIZATION" == "true" ]]; then
              echo "Developer ID certificate secrets are required for tagged releases."
              exit 1
            fi
            echo "::warning::Developer ID secrets are not configured; this development artifact will be ad-hoc signed."
            echo "MACOS_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/field-trial-secretary-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/field-trial-secretary-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "No Developer ID Application identity was found in the imported certificate."
            exit 1
          fi

          echo "MACOS_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "MACOS_SIGNED=true" >> "$GITHUB_ENV"
          echo "Developer ID signing identity configured."

      - name: Install build dependencies
        run: python3 -m pip install --upgrade -r requirements-macos-build.txt

      - name: Build application and DMG
        run: bash build_macos_package.sh

      - name: Smoke test packaged server
        shell: bash
        run: |
          APP_EXECUTABLE="dist/Field Trial Secretary.app/Contents/MacOS/Field Trial Secretary"
          "$APP_EXECUTABLE" --host 127.0.0.1 --port 8877 >build/macos-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          STATUS_READY=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8877/api/status >build/macos-status.json; then
              STATUS_READY=true
              break
            fi
            sleep 1
          done

          if [[ "$STATUS_READY" != "true" ]]; then
            echo "Packaged application did not start."
            cat build/macos-smoke.log || true
            cat "$HOME/Library/Application Support/Field Trial Secretary/logs/field_trial_secretary.log" || true
            exit 1
          fi

          python3 -c 'import json; data=json.load(open("build/macos-status.json")); assert data["ok"] is True; print(data["dbPath"])'

      - name: Save recovery installer before notarization
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-macOS-${{ matrix.architecture }}-before-notarization
          path: dist/Field-Trial-Secretary-*-macOS-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Notarize and staple macOS installer
        timeout-minutes: 105
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_NOTARIZATION: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if [[ "${MACOS_SIGNED:-false}" != "true" ]]; then
            if [[ "$REQUIRE_NOTARIZATION" == "true" ]]; then
              echo "Tagged releases cannot be published without Developer ID signing."
              exit 1
            fi
            echo "::warning::Skipping notarization for an unsigned development artifact."
            exit 0
          fi

          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            if [[ "$REQUIRE_NOTARIZATION" == "true" ]]; then
              echo "APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are required for tagged releases."
              exit 1
            fi
            echo "::warning::Notarization credentials are not configured; skipping development artifact notarization."
            exit 0
          fi

          DMG_PATH="$(find dist -maxdepth 1 -name 'Field-Trial-Secretary-*-macOS-*.dmg' -print -quit)"
          if [[ -z "$DMG_PATH" ]]; then
            echo "No macOS DMG was found for notarization."
            exit 1
          fi

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --verbose=2 --type open --context context:primary-signature "$DMG_PATH"
          echo "MACOS_NOTARIZED=true" >> "$GITHUB_ENV"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: Field-Trial-Secretary-macOS-${{ matrix.architecture }}
          path: dist/Field-Trial-Secretary-*-macOS-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" && -f "$MACOS_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v5

      - name: Select version release notes
        shell: bash
        run: echo "RELEASE_NOTES=docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" >> "$GITHUB_ENV"

      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: Field-Trial-Secretary-*
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Field Trial Secretary ${{ github.ref_name }}
          prerelease: true
          body_path: ${{ env.RELEASE_NOTES }}
          files: release-assets/*
